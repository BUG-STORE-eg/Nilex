<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NILEX Mail</title>

    <link rel="stylesheet" href="mail.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="app">

    <!-- LOGIN -->
    <section id="loginScreen" class="screen">
        <div class="auth-card">

            <div class="logo">NILEX</div>
            <div class="subtitle">NILEX Mail</div>

            <h1>تسجيل الدخول</h1>

            <input
                id="loginUsername"
                type="text"
                placeholder="Username أو Email"
                autocomplete="username"
            >

            <input
                id="loginPassword"
                type="password"
                placeholder="كلمة المرور"
                autocomplete="current-password"
            >

            <button id="loginBtn">تسجيل الدخول</button>

            <button id="showRegisterBtn" class="secondary">
                إنشاء حساب
            </button>

            <div id="loginError" class="error"></div>

        </div>
    </section>


    <!-- REGISTER -->
    <section id="registerScreen" class="screen hidden">
        <div class="auth-card">

            <div class="logo">NILEX</div>

            <h1>إنشاء حساب</h1>

            <input
                id="registerUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="registerPassword"
                type="password"
                placeholder="كلمة المرور"
                autocomplete="new-password"
            >

            <input
                id="registerDisplayName"
                type="text"
                placeholder="الاسم"
            >

            <button id="registerBtn">إنشاء الحساب</button>

            <button id="backLoginBtn" class="secondary">
                العودة لتسجيل الدخول
            </button>

            <div id="registerError" class="error"></div>

        </div>
    </section>


    <!-- MAIL APP -->
    <section id="mailScreen" class="mail-screen hidden">

        <header class="topbar">

            <div>
                <div class="brand">NILEX</div>
                <div id="welcomeText" class="welcome"></div>
            </div>

            <div class="top-actions">

                <button id="homeBtn" class="secondary">
                    الرئيسية
                </button>

                <button id="logoutBtn" class="logout">
                    تسجيل الخروج
                </button>

            </div>

        </header>


        <main class="mail-layout">

            <!-- SIDEBAR -->
            <aside class="sidebar">

                <h2>إرسال طلبك للأدمن</h2>

                <button id="newMessageBtn" class="new-message">
                    + رسالة جديدة
                </button>

                <button class="folder active" data-folder="inbox">
                    📥 الوارد
                    <span id="inboxCount">0</span>
                </button>

                <button class="folder" data-folder="sent">
                    📤 المرسل
                </button>

                <div id="adminControls" class="admin-controls hidden">

                    <div class="admin-title">
                        لوحة الأدمن
                    </div>

                    <button id="adminComposeBtn" class="folder">
                        ✉ إرسال رسالة
                    </button>

                    <button id="refreshBtn" class="folder">
                        🔄 تحديث
                    </button>

                </div>

            </aside>


            <!-- CONTENT -->
            <section class="content">

                <div id="listView">

                    <div class="content-header">
                        <h2 id="folderTitle">الوارد</h2>
                    </div>

                    <div id="messagesList" class="messages-list">
                        <div class="loading">
                            جاري التحميل...
                        </div>
                    </div>

                </div>


                <!-- MESSAGE VIEW -->
                <div id="messageView" class="message-view hidden">

                    <button id="backToListBtn" class="back-btn">
                        ← رجوع
                    </button>

                    <div id="messageContent"></div>

                </div>


                <!-- COMPOSE -->
                <div id="composeView" class="compose-view hidden">

                    <button id="cancelComposeBtn" class="back-btn">
                        ← رجوع
                    </button>

                    <h2 id="composeTitle">
                        إرسال طلبك للأدمن
                    </h2>

                    <div id="recipientBox" class="field hidden">

                        <label>إلى</label>

                        <input
                            id="recipientInput"
                            type="text"
                            placeholder="username@nilex"
                        >

                    </div>

                    <div class="field">

                        <label>الموضوع</label>

                        <input
                            id="subjectInput"
                            type="text"
                            placeholder="موضوع الرسالة"
                        >

                    </div>

                    <div class="field">

                        <label>الرسالة</label>

                        <textarea
                            id="bodyInput"
                            placeholder="اكتب رسالتك هنا..."
                        ></textarea>

                    </div>

                    <button id="sendMessageBtn" class="send-btn">
                        إرسال
                    </button>

                    <div id="composeError" class="error"></div>

                </div>

            </section>

        </main>

    </section>

</div>

<script src="mail.js"></script>

</body>
</html>
