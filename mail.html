<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NILEX Mail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mail.css">
</head>
<body><div class="mail-bg"></div>
<section id="loginView" class="auth-view"><div class="auth-card"><div class="auth-logo"><span>N</span><b>NILEX</b></div><p class="auth-kicker">NILEX INTERNAL MAIL</p><h1>تسجيل الدخول</h1><p class="auth-muted">ادخل إلى نظام المراسلات الداخلي.</p><input id="loginUsername" type="text" placeholder="اسم المستخدم"><input id="loginPassword" type="password" placeholder="كلمة المرور"><button id="loginButton" class="main-btn">دخول</button><button id="showSignup" class="link-btn">إنشاء حساب جديد</button></div></section>
<section id="signupView" class="auth-view" style="display:none"><div class="auth-card"><div class="auth-logo"><span>N</span><b>NILEX</b></div><p class="auth-kicker">NILEX ACCOUNT</p><h1>إنشاء حساب</h1><p class="auth-muted">أنشئ حسابًا لاستخدام نظام NILEX Mail.</p><input id="signupUsername" type="text" placeholder="اسم المستخدم"><input id="signupEmail" type="text" placeholder="username@nilex" readonly><input id="signupPassword" type="password" placeholder="كلمة المرور"><button id="signupButton" class="main-btn">إنشاء الحساب</button><button id="showLogin" class="link-btn">لدي حساب بالفعل</button></div></section>
<section id="mailApp" style="display:none"><header class="mail-top"><a href="index.html" class="mail-brand"><span>N</span>NILEX <small>MAIL</small></a><div class="account"><div><b id="accountName">User</b><small id="accountEmail"></small></div><button id="logoutButton">خروج</button></div></header>
<div class="mail-layout"><aside class="sidebar"><button id="newMessageBtn" class="new-btn">＋ رسالة جديدة</button><div class="folder active" id="inboxFolder">✉ <span>Inbox</span></div><div class="folder" id="sentFolder">↗ <span>Sent</span></div><div id="adminControls" class="admin-controls" style="display:none"><div class="admin-label">ADMIN</div><button id="adminComposeBtn">＋ رسالة لمستخدم</button></div></aside>
<main class="mail-main"><div id="messagesList" class="messages-list"></div>
<section id="messageView" class="message-view" style="display:none"><div class="view-toolbar"><button id="backToListBtn">← رجوع</button><button id="replyMessageBtn" class="reply-btn" style="display:none">↩ رد</button></div><h1 id="viewSubject"></h1><div class="message-meta"><span id="viewFrom"></span><span id="viewTo"></span><span id="viewDate"></span></div><div id="viewBody" class="view-body"></div></section>
<section id="composeView" class="compose-view" style="display:none"><div class="compose-head"><div><span class="compose-kicker">NILEX MAIL</span><h1>رسالة جديدة</h1></div><button id="cancelComposeBtn">إلغاء</button></div>
<div id="normalRecipientBox" class="recipient-box"><small>إلى</small><strong>NILEX Admin — admin@nilex</strong></div>
<div id="adminRecipientBox" class="field" style="display:none"><label>إلى المستخدم</label><select id="adminReceiver"><option value="">اختر الحساب</option></select></div>
<div id="serviceLabel" class="field"><label>الخدمة</label><select id="messageSubject"><option value="">اختر الخدمة</option><option value="تطوير البرامج والمواقع">تطوير البرامج والمواقع</option><option value="التصميم والهوية">التصميم والهوية</option><option value="الدعم التقني">الدعم التقني</option><option value="الاستضافة وإدارة المواقع">الاستضافة وإدارة المواقع</option><option value="خدمات الألعاب">خدمات الألعاب</option><option value="السوشيال والمحتوى">السوشيال والمحتوى</option><option value="خدمة أخرى / استفسار">خدمة أخرى / استفسار</option></select></div>
<div id="adminSubjectBox" class="field" style="display:none"><label>عنوان الرسالة</label><input id="adminSubject" type="text" placeholder="عنوان الرسالة"></div>
<div class="field"><label>الرسالة</label><textarea id="messageBody" rows="12" placeholder="اكتب رسالتك هنا..."></textarea></div>
<div id="composeError" class="error"></div><button id="sendButton" class="main-btn send-btn">إرسال الرسالة ↗</button></section></main></div></section>
<div id="mailToast" class="mail-toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="mail.js"></script>
</body></html>
